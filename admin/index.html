<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleaning Business Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#0f1f2e; --muted:#5b6b7a; --line:#e3e8ee;
  --brand:#0b6e6e; --brand-2:#0e8a8a; --brand-soft:#e3f3f2; --navy:#10263b;
  --good:#1f8a4c; --good-soft:#e5f5ec; --warn:#b26a00; --warn-soft:#fff3df;
  --bad:#c0392b; --bad-soft:#fdecea; --blue:#2563a8; --blue-soft:#e7effa;
  --radius:14px; --shadow:0 1px 2px rgba(16,38,59,.06),0 4px 14px rgba(16,38,59,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:232px;background:var(--navy);color:#cfe0ea;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:#fff;font-weight:800;font-size:16px;line-height:1.2}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#19b3a8,#0b6e6e);display:grid;place-items:center;flex-shrink:0}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfe0ea;text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(25,179,168,.18);color:#fff}
.nav svg{width:19px;height:19px;flex-shrink:0}
.side .foot{margin-top:auto;font-size:12px;color:#8aa3b5;padding:8px}
/* Main */
main{flex:1;min-width:0;padding:26px 30px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f7f9fb}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.banner{padding:11px 14px;border-radius:10px;margin-bottom:16px;font-size:14px;display:none}
.banner.show{display:block}
.banner.warn{background:var(--warn-soft);color:#7a4a00}
.banner.info{background:var(--blue-soft);color:#1d4a7e}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
/* lists */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.toolbar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f8fafb}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablecard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.strong{font-weight:700}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:#eef1f4;color:#55636f}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
/* list items small */
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,31,46,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 14px}
.scrim.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{margin:0;font-size:18px}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.f textarea{min-height:70px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;color:var(--ink);font-weight:600;cursor:pointer}
.checks input{width:auto}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.mobile-tabs{display:none}
.hidden{display:none!important}
.cards-m{display:none}
/* Mobile */
@media (max-width:860px){
  .side{display:none}
  main{padding:18px 14px 100px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px 14px}
  .kpi .v{font-size:21px}
  .grid2{grid-template-columns:1fr}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobile-tabs a{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
  .mobile-tabs a.on{color:var(--brand)}
  .mobile-tabs svg{width:22px;height:22px}
  .tablecard table{display:none}
  .cards-m{display:block}
  .mc{padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .mc:last-child{border-bottom:0}
  .mc .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .mc .r2{color:var(--muted);font-size:13px;margin-top:3px;display:flex;justify-content:space-between;gap:8px}
  .modal .body{grid-template-columns:1fr}
  .scrim{padding:12px 8px}
  h1{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div><span id="bizName">Your Cleaning Co.</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="syncState">Connecting…</div>
  </aside>
  <main>
    <div class="banner warn" id="bannerOffline">Not connected to storage. You can try things out, but changes on this visit won't be saved.</div>
    <div class="banner info" id="bannerSlow">Still loading your data. It may be out of date until the connection catches up.</div>
    <div class="banner warn" id="bannerReadonly">You can view this dashboard but not change it. Ask the owner for Editor access.</div>
    <section id="view"></section>
  </main>
</div>
<nav class="mobile-tabs" id="mtabs"></nav>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I={
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  clients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01"/></svg>',
  workers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 010 8M22 21c0-3-1.5-5-4-5.7"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};
const VIEWS=[["overview","Overview"],["jobs","Jobs"],["clients","Clients"],["workers","Workers"],["expenses","Expenses"],["settings","Settings"]];

/* ---------- state ---------- */
const S={clients:{},workers:{},jobs:{},expenses:{},settings:{bizName:"Your Cleaning Co."},online:false,canWrite:true};
let db=null;
const COLS=["clients","workers","jobs","expenses"];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=(n,dec)=>{n=num(n);return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0})};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}):"—"};
const fmtT=t=>{if(!t)return"";const [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+ap};
const ym=s=>s?s.slice(0,7):"";
const list=c=>Object.entries(S[c]).map(([id,v])=>Object.assign({id},v));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
const VISITS={"Daily (7 days)":30.4,"5x / week":21.7,"3x / week":13,"2x / week":8.7,"Weekly":4.33,"Bi-weekly":2.17,"Monthly":1,"One-time / as needed":0};
const CLIENT_TYPES=["Office","Medical / Dental","Retail","Restaurant","Gym / Fitness","School / Daycare","Church","Warehouse / Industrial","Property Management","Post-construction","Other"];
const CLIENT_STATUS={"Active":"p-good","Prospect":"p-blue","Paused":"p-warn","Lost":"p-gray"};
const JOB_STATUS={"Scheduled":"p-blue","Completed":"p-warn","Paid":"p-good","Canceled":"p-gray"};
const EXP_CATS=["Supplies","Equipment","Fuel / Mileage","Insurance","Payroll taxes","Marketing","Software","Licenses / Fees","Vehicle","Other"];

/* ---------- persistence ---------- */
async function save(col,id,data){
  if(!S.canWrite){toast("View-only access");return false}
  if(!db){S[col][id]=data;render();return true}
  try{await db.collection(col).doc(id).set(data);return true}
  catch(e){return handleWriteErr(e,()=>db.collection(col).doc(id).set(data))}
}
async function remove(col,id){
  if(!S.canWrite){toast("View-only access");return false}
  if(!db){delete S[col][id];render();return true}
  try{await db.collection(col).doc(id).delete();return true}
  catch(e){return handleWriteErr(e,()=>db.collection(col).doc(id).delete())}
}
async function handleWriteErr(e,retry){
  const code=e&&e.code;
  if(code==="unavailable"){await new Promise(r=>setTimeout(r,500+Math.random()*800));try{await retry();return true}catch(_){}}
  if(code==="invalid_argument"){S.canWrite=false;$("#bannerReadonly").classList.add("show");toast("You don't have permission to change this");return false}
  if(code==="quota_exceeded"){toast("Storage is full — delete old records to add more");return false}
  toast("Couldn't save. Check your connection and try again.");return false;
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ---------- stats ---------- */
function workerRate(id){const w=S.workers[id];return w?num(w.payRate):0}
function jobLabor(j){const ids=Array.isArray(j.workerIds)?j.workerIds:[];return ids.reduce((a,id)=>a+num(j.hours)*workerRate(id),0)}
const earned=j=>j.status==="Completed"||j.status==="Paid";
function monthStats(key){
  const jobs=list("jobs").filter(j=>ym(j.date)===key&&earned(j));
  const revenue=jobs.reduce((a,j)=>a+num(j.price),0);
  const labor=jobs.reduce((a,j)=>a+jobLabor(j),0);
  const exp=list("expenses").filter(e=>ym(e.date)===key).reduce((a,e)=>a+num(e.amount),0);
  return {revenue,labor,exp,profit:revenue-labor-exp,count:jobs.length};
}
function mrr(){return list("clients").filter(c=>c.status==="Active").reduce((a,c)=>a+num(c.rate)*(VISITS[c.frequency]||0),0)}
function monthKey(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthLabel(key){const [y,m]=key.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"short"})}

/* ---------- nav ---------- */
function current(){const h=(location.hash||"").slice(1);return VIEWS.some(v=>v[0]===h)?h:"overview"}
function renderNav(){
  const cur=current();
  $("#nav").innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" class="${k===cur?"on":""}">${I[k]}${l}</a>`).join("");
  $("#mtabs").innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" class="${k===cur?"on":""}">${I[k]}${l}</a>`).join("");
  $("#bizName").textContent=S.settings.bizName||"Your Cleaning Co.";
}

/* ---------- views ---------- */
function header(title,sub,btn){
  return `<div class="top"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div>${btn||""}</div>`;
}
function vOverview(){
  const key=monthKey(0), m=monthStats(key), prev=monthStats(monthKey(-1));
  const clients=list("clients"), active=clients.filter(c=>c.status==="Active").length, prospects=clients.filter(c=>c.status==="Prospect").length;
  const workers=list("workers").filter(w=>w.status!=="Inactive").length;
  const unpaid=list("jobs").filter(j=>j.status==="Completed");
  const unpaidAmt=unpaid.reduce((a,j)=>a+num(j.price),0);
  const margin=m.revenue>0?Math.round(m.profit/m.revenue*100):null;
  const t=todayStr(); const wk=new Date();wk.setDate(wk.getDate()+7);
  const wkStr=wk.getFullYear()+"-"+String(wk.getMonth()+1).padStart(2,"0")+"-"+String(wk.getDate()).padStart(2,"0");
  const upcoming=list("jobs").filter(j=>j.status==="Scheduled"&&j.date>=t&&j.date<=wkStr).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const overdue=list("jobs").filter(j=>j.status==="Scheduled"&&j.date&&j.date<t);
  const delta=prev.revenue>0?Math.round((m.revenue-prev.revenue)/prev.revenue*100):null;
  const greeting=new Date().getHours()<12?"Good morning":new Date().getHours()<17?"Good afternoon":"Good evening";

  // top clients this year
  const yr=String(new Date().getFullYear());
  const byClient={};list("jobs").filter(j=>earned(j)&&(j.date||"").startsWith(yr)).forEach(j=>{byClient[j.clientId]=(byClient[j.clientId]||0)+num(j.price)});
  const top=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // worker hours this month
  const wh={};list("jobs").filter(j=>ym(j.date)===key&&earned(j)).forEach(j=>(j.workerIds||[]).forEach(id=>{wh[id]=(wh[id]||0)+num(j.hours)}));
  const whList=Object.entries(wh).sort((a,b)=>b[1]-a[1]);

  const isEmpty=!clients.length&&!list("jobs").length&&!list("workers").length;
  return header(`${greeting}`,`${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} · ${esc(S.settings.bizName||"")}`,`<button class="btn" data-act="new-job">+ New job</button>`)+
  (isEmpty?`<div class="card" style="margin-bottom:14px"><h3>Get started</h3><div class="muted" style="font-size:14px;line-height:1.6">1. Add your team under <a href="#workers">Workers</a> with their hourly pay.<br>2. Add your accounts under <a href="#clients">Clients</a> with price per visit and how often you clean.<br>3. Schedule cleanings under <a href="#jobs">Jobs</a>, then mark them Completed and Paid. Your stats fill in automatically.</div></div>`:"")+
  `<div class="kpis">
    <div class="kpi"><div class="l">Revenue · ${monthLabel(key)}</div><div class="v">${money(m.revenue)}</div><div class="h">${delta===null?m.count+(m.count===1?" job done":" jobs done"):(delta>=0?"▲ ":"▼ ")+Math.abs(delta)+"% vs last month"}</div></div>
    <div class="kpi"><div class="l">Profit · ${monthLabel(key)}</div><div class="v" style="color:${m.profit<0?"var(--bad)":"inherit"}">${money(m.profit)}</div><div class="h">${margin===null?"After labor & expenses":margin+"% margin"}</div></div>

function chart(){
  const keys=[-5,-4,-3,-2,-1,0].map(monthKey);
  const data=keys.map(k=>{const s=monthStats(k);return {k,rev:s.revenue,cost:s.labor+s.exp}});
  const max=Math.max(100,...data.map(d=>Math.max(d.rev,d.cost)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=2?2:m<=5?5:10)*p})();
  const W=520,H=210,L=46,B=26,T=10,cw=(W-L-6)/6,bw=Math.min(22,cw/3.2);
  const y=v=>T+(H-T-B)*(1-v/nice);
  let g="";
  for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e8edf1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#7b8a97">${v>=1000?"$"+(v/1000)+"k":"$"+v}</text>`}
  data.forEach((d,i)=>{const cx=L+cw*i+cw/2;
    g+=`<rect x="${cx-bw-2}" y="${y(d.rev)}" width="${bw}" height="${Math.max(0,H-B-y(d.rev))}" rx="4" fill="#0b6e6e"><title>${monthLabel(d.k)} revenue ${money(d.rev)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${y(d.cost)}" width="${bw}" height="${Math.max(0,H-B-y(d.cost))}" rx="4" fill="#f0a04b"><title>${monthLabel(d.k)} costs ${money(d.cost)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="11.5" fill="#5b6b7a" font-weight="600">${monthLabel(d.k)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and costs, last six months">${g}</svg>`;
}

function field(label,name,val,opts){
  opts=opts||{};const full=opts.full?" full":"";
  if(opts.options)return `<div class="f${full}"><label>${label}</label><select name="${name}">${opts.options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val==null?"":val)?"selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
  if(opts.area)return `<div class="f${full}"><label>${label}</label><textarea name="${name}">${esc(val)}</textarea></div>`;
  return `<div class="f${full}"><label>${label}</label><input name="${name}" type="${opts.type||"text"}" value="${esc(val)}" ${opts.step?`step="${opts.step}"`:""} ${opts.req?"required":""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""} ${opts.type==="number"?'min="0" inputmode="decimal"':""}></div>`;
}
function openModal(title,bodyHtml,onSubmit,onDelete){
  $("#modal").innerHTML=`<form id="mform"><header><h2>${title}</h2><button type="button" class="x" data-close aria-label="Close">×</button></header><div class="body">${bodyHtml}</div><footer><div>${onDelete?`<button type="button" class="btn ghost sm" id="delBtn" style="color:var(--bad)">Delete</button>`:""}</div><div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save</button></div></footer></form>`;
  $("#scrim").classList.add("show");
  const form=$("#mform");
  form.addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(form);const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent="Saving…";const ok=await onSubmit(fd);if(ok!==false){closeModal();toast("Saved")}else{btn.disabled=false;btn.textContent="Save"}});
  if(onDelete){$("#delBtn").addEventListener("click",function(){
    if(this.dataset.armed){onDelete().then(ok=>{if(ok!==false){closeModal();toast("Deleted")}})}
    else{this.dataset.armed="1";this.textContent="Tap again to delete";this.classList.remove("ghost");this.classList.add("danger");this.style.color="#fff"}
  })}
  const first=form.querySelector("input,select");if(first&&window.innerWidth>860)first.focus();
}
function closeModal(){$("#scrim").classList.remove("show");$("#modal").innerHTML=""}

  const j=id?S.jobs[id]:Object.assign({status:"Scheduled",date:todayStr(),time:"18:00",hours:2,workerIds:[]},preset||{});
  if(!id&&!j.clientId&&cs[0]){j.clientId=cs[0].id;j.price=cs[0].rate}
  const ws=list("workers").filter(w=>w.status!=="Inactive"||(j.workerIds||[]).includes(w.id));
  const opts=cs.map(c=>[c.id,c.name]);if(id&&j.clientId&&!S.clients[j.clientId])opts.unshift([j.clientId,"(Removed client)"]);
  openModal(id?"Edit job":"New job",
    field("Client","clientId",j.clientId,{full:1,options:opts})+
    field("Date","date",j.date,{type:"date",req:1})+
    field("Start time","time",j.time,{type:"time"})+
    field("Price ($)","price",j.price,{type:"number",step:"0.01"})+
    field("Hours per worker","hours",j.hours,{type:"number",step:"0.25"})+
    `<div class="f full"><label>Crew</label><div class="checks">${ws.length?ws.map(w=>`<label><input type="checkbox" name="workerIds" value="${esc(w.id)}" ${(j.workerIds||[]).includes(w.id)?"checked":""}>${esc(w.name)}</label>`).join(""):`<span class="muted">No workers yet — add them on the Workers tab.</span>`}</div></div>`+
    field("Status","status",j.status,{full:1,options:Object.keys(JOB_STATUS)})+
    (id?"":`<div class="f full"><label>Repeat</label><select name="repeat"><option value="0">One-time</option><option value="7">Every week</option><option value="14">Every 2 weeks</option><option value="1">Every weekday (Mon–Fri)</option></select></div><div class="f"><label>Repeat until</label><input type="date" name="until"></div><div class="f"></div>`)+
    field("Notes","notes",j.notes,{full:1,area:1}),
    async fd=>{
      const d={clientId:fd.get("clientId"),date:fd.get("date"),time:fd.get("time"),price:num(fd.get("price")),hours:num(fd.get("hours")),workerIds:fd.getAll("workerIds"),status:fd.get("status"),notes:fd.get("notes")||"",updatedAt:Date.now()};
      if(!d.date)return false;
      if(id)return save("jobs",id,d);
      const rep=num(fd.get("repeat")),until=fd.get("until");
      const dates=[d.date];
      if(rep&&until&&until>d.date){let cur=parseD(d.date);const end=parseD(until);let guard=0;
        while(guard++<200){if(rep===1){cur.setDate(cur.getDate()+1);while(cur.getDay()===0||cur.getDay()===6)cur.setDate(cur.getDate()+1)}else cur.setDate(cur.getDate()+rep);
          if(cur>end)break;dates.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"))}}
      for(const dt of dates){const ok=await save("jobs",newId(),Object.assign({},d,{date:dt}));if(!ok)return false}
      if(dates.length>1)setTimeout(()=>toast(dates.length+" jobs scheduled"),2300);
      return true;
    },
    id?()=>remove("jobs",id):null);
  // auto-fill price when client changes (new jobs)
  const sel=$("#mform [name=clientId]");
  if(sel&&!id)sel.addEventListener("change",()=>{const c=S.clients[sel.value];if(c&&c.rate)$("#mform [name=price]").value=c.rate});
}
function expenseForm(id){
  const e=id?S.expenses[id]:{date:todayStr(),category:"Supplies"};
  openModal(id?"Edit expense":"New expense",
    field("Date","date",e.date,{type:"date",req:1})+
    field("Amount ($)","amount",e.amount,{type:"number",step:"0.01",req:1})+
    field("Category","category",e.category,{options:EXP_CATS})+
    field("Vendor","vendor",e.vendor,{ph:"e.g. Home Depot"})+
    field("Note","note",e.note,{full:1}),
    fd=>{const d=Object.fromEntries(fd);d.amount=num(d.amount);d.updatedAt=Date.now();return save("expenses",id||newId(),d)},
    id?()=>remove("expenses",id):null);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-close],[data-act],[data-quick],[data-edit-job],[data-edit-client],[data-edit-worker],[data-edit-expense]");
  if(!t)return;
  if(t.hasAttribute("data-close")){closeModal();return}
  if(t.dataset.quick){e.stopPropagation();const j=S.jobs[t.dataset.quick];if(j){save("jobs",t.dataset.quick,Object.assign({},j,{status:t.dataset.to,updatedAt:Date.now()})).then(ok=>ok&&toast("Marked "+t.dataset.to))}return}
  const a=t.dataset.act;
  if(a==="new-job")return jobForm();
  if(a==="new-client")return clientForm();
  if(a==="new-worker")return workerForm();
  if(a==="new-expense")return expenseForm();
  if(t.dataset.editJob)return jobForm(t.dataset.editJob);
  if(t.dataset.editClient)return clientForm(t.dataset.editClient);
  if(t.dataset.editWorker)return workerForm(t.dataset.editWorker);
  if(t.dataset.editExpense)return expenseForm(t.dataset.editExpense);
});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.filter;if(!k)return;const [v,p]=k.split(".");F[v][p]=e.target.value;render()});
document.addEventListener("submit",async e=>{if(e.target.id!=="setForm")return;e.preventDefault();const fd=new FormData(e.target);const d={bizName:(fd.get("bizName")||"").trim()||"Your Cleaning Co.",goal:num(fd.get("goal"))};
  if(!S.canWrite){toast("View-only access");return}
  if(!db){S.settings=d;render();toast("Saved");return}
  try{await db.doc("meta/settings").set(d);toast("Saved")}catch(err){handleWriteErr(err,()=>db.doc("meta/settings").set(d))}});
window.addEventListener("hashchange",()=>{closeModal();render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
render();
(async function boot(){
  let api=null;
  try{api=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(_){api=null}
  if(!api){$("#bannerOffline").classList.add("show");$("#syncState").textContent="Not saving · preview mode";return}
  db=api;S.online=true;
  try{const u=window.claude.use?await window.claude.use("user"):null;if(u&&u.canEdit){const ce=await u.canEdit();if(ce===false){S.canWrite=false;$("#bannerReadonly").classList.add("show")}}}catch(_){}
  let pending=COLS.length+1;
  const slow=setTimeout(()=>{if(pending>0)$("#bannerSlow").classList.add("show")},10000);
  const done=()=>{pending--;if(pending<=0){clearTimeout(slow);$("#bannerSlow").classList.remove("show");$("#syncState").textContent="● Synced"}};
  let raf=0;const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!$("#scrim").classList.contains("show")||true)renderKeepModal()})};
  COLS.forEach(col=>{let first=true;
    db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[col]=o;if(first&&!snap.metadata.fromCache){first=false;done()}schedule()},
      err=>{if(first){first=false;done()}if(err&&err.code==="revoked"){$("#syncState").textContent="Access changed"}else toast("Lost connection to "+col)});
  });
  let firstS=true;
  db.doc("meta/settings").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({bizName:"Your Cleaning Co."},s.data());if(firstS&&!s.metadata.fromCache){firstS=false;done()}schedule()},()=>{if(firstS){firstS=false;done()}});
})();
function renderKeepModal(){
  // re-render the page behind an open modal without closing it
  renderNav();
  const v=current();const map={overview:vOverview,jobs:vJobs,clients:vClients,workers:vWorkers,expenses:vExpenses,settings:vSettings};
  if(v==="settings"&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#setForm"))return;
  const a=document.activeElement, fk=a&&a.dataset?a.dataset.filter:null, pos=a&&a.selectionStart;
  $("#view").innerHTML=map[v]();
  if(fk){const el=document.querySelector(`[data-filter="${fk}"]`);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
}
})();
</script>
